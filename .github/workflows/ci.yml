name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests evals
      - run: pytest
      - name: Smoke test the offline copilot on the committed dataset
        env:
          HOC_LLM_BACKEND: offline
        run: hoc ask "How does Tampa General Hospital compare to its peers in 2023?"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Export data and parity fixtures for the in-browser engine
        working-directory: .
        run: pip install -e . && hoc export-web --out web/public/data --fixtures web/test-fixtures/parity.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Parity tests (browser engine matches Python)
        run: npm test
      - run: npm run build
      - run: npm run build-storybook -- --quiet
