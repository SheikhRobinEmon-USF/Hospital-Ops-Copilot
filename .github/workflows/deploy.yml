name: Deploy public demo

# Publishes the public demo to GitHub Pages on every push to main:
#   https://sheikhrobinemon-usf.github.io/Hospital-Ops-Copilot/
# No server: the analytics and the offline analyst run in the visitor's browser (web/src/engine),
# on data exported by Python (hoc export-web). Requires Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Export data for the in-browser engine (with parity fixtures)
        run: hoc export-web --out web/public/data --fixtures web/test-fixtures/parity.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Parity tests (browser engine matches Python)
        run: npm test
        working-directory: web
      - name: Static export
        working-directory: web
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_ENGINE: browser
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
