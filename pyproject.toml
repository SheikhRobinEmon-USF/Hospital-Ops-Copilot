[project]
name = "hospital-ops-copilot"
version = "0.1.0"
description = "AI-powered hospital financial benchmarking and decision support using public CMS cost report data, transparent analytics, and evidence-grounded local LLMs (Ollama)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sheikh Robin Emon" }]
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.35",
  "altair>=5.2",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
hoc = "hospital_ops_copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_ops_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM103", "SIM105"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
